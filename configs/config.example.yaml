# Snowy 本地运行配置模板。
#
# 复制为 configs/config.yaml 后填写本地私密值。configs/config.yaml 已被
# .gitignore 忽略，不要提交真实 API Key。
server:
  host: "0.0.0.0"
  port: 8080
  run_mode: "all"                  # all / api / worker
  startup_migrate: true             # Docker 标准路径已先执行 make migrate-up；容器内可改为 false 避免重复迁移
  mode: "release"                  # debug / release / test
  read_timeout: 30s
  write_timeout: 10m
  shutdown_timeout: 10s

database:
  # binary 与 Docker 统一使用该主机名访问宿主机暴露的 MySQL 端口。
  # 宿主机运行 binary 前请确保 hosts 中存在：
  #   127.0.0.1 snowy-host.internal
  # Docker Compose 会通过 extra_hosts 把该主机名映射到宿主机网关。
  host: "snowy-host.internal"
  port: 3306
  user: "snowy"
  password: "snowy_secret"
  name: "snowy"
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 30m

redis:
  addr: "snowy-host.internal:6379"
  password: ""
  db: 0
  pool_size: 20

llm:
  # 使用 models[] 声明顺序作为调用顺序；所有供应商统一走 OpenAI-compatible 协议。
  # 将 base_url/model/api_key 替换为 OpenAI、小米或其他兼容网关的真实值。
  models:
    - provider: "openai"
      model_provider: "custom"
      model: "your-model-name"
      api_key: "replace-with-local-api-key"
      base_url: "https://api.openai.com/v1"
      timeout: 10m
      temperature: 0.2
      max_tokens: 131072
      max_retries: 2
      retry_interval: 1s

auth:
  jwt_secret: "change-me-in-production"
  access_token_ttl: 30m
  refresh_token_ttl: 168h           # 7 days
  google_oauth:
    client_id: ""                    # Google Cloud Console → OAuth 2.0 Client ID
    client_secret: ""
    redirect_uri: "http://localhost:3001"

ratelimit:
  authenticated_rpm: 300              # 已认证用户 300 次/分钟
  anonymous_rpm: 120                  # 匿名用户 120 次/分钟

token_budget:
  per_request_input: 131072
  per_request_output: 131072
  per_session: 51200
  per_user_daily: 204800

observability:
  otel_endpoint: "127.0.0.1:4317"
  prometheus_path: "/metrics"
  log_level: "info"                  # debug / info / warn / error
  log_format: "json"                 # json / text
