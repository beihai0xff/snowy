# Snowy - Local Development Docker Compose
# 参考技术方案 §6 技术栈选型 & §18 数据库与存储设计
#
# 默认运行只需要 MySQL / Redis。
# Prometheus、Grafana 保留为可选观测服务，可通过显式 make 目标按需启动。

services:
  # ──────────────────────────────────────────────
  # MySQL — 主数据库
  # ──────────────────────────────────────────────
  mysql:
    image: ${MYSQL_IMAGE:-docker.m.daocloud.io/library/mysql:8.0}
    container_name: snowy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: snowy_root_secret
      MYSQL_USER: snowy
      MYSQL_PASSWORD: snowy_secret
      MYSQL_DATABASE: snowy
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "snowy", "-psnowy_secret"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ──────────────────────────────────────────────
  # Redis — 缓存 / 会话上下文 / 限流计数 / Asynq 队列
  # ──────────────────────────────────────────────
  redis:
    image: ${REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    container_name: snowy-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Prometheus — 指标采集
  # ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: snowy-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  # ──────────────────────────────────────────────
  # Grafana — 可视化仪表盘
  # ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: snowy-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: snowy_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # ──────────────────────────────────────────────
  # Snowy — Go 单体服务（API + Embedded Worker）
  # ──────────────────────────────────────────────
  snowy:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        TARGET: snowy
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        GO_BUILDER_IMAGE: ${GO_BUILDER_IMAGE:-docker.m.daocloud.io/library/golang:1.25-alpine}
        ALPINE_RUNTIME_IMAGE: ${ALPINE_RUNTIME_IMAGE:-docker.m.daocloud.io/library/alpine:3.21}
    image: snowy:latest
    container_name: snowy
    restart: unless-stopped
    environment:
      - SNOWY_SERVER_RUN_MODE
      - SNOWY_SERVER_STARTUP_MIGRATE=false
    extra_hosts:
      - "snowy-host.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - ../../configs/config.yaml:/app/configs/config.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["--config", "configs/config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────────
  # Snowy Web — 前端 Nginx 服务
  # ──────────────────────────────────────────────
  snowy-web:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.web
      args:
        NODE_BUILDER_IMAGE: ${NODE_BUILDER_IMAGE:-docker.m.daocloud.io/library/node:22-alpine}
        NGINX_RUNTIME_IMAGE: ${NGINX_RUNTIME_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
    image: snowy-web:latest
    container_name: snowy-web
    restart: unless-stopped
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
