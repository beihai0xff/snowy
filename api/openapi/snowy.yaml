openapi: "3.1.0"
info:
  title: Snowy API
  description: |
    Snowy AIGC 学习平台 API — 面向高中生的知识检索、物理 / 3D 场景代码生成渲染、生物建模。
    参考技术方案 §17。
  version: "0.1.0"

servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发

paths:
  /agent/chat:
    post:
      summary: Agent 会话
      description: 统一问答入口，支持 SSE 流式。Accept text/event-stream 时进入流式模式。
      tags: [Agent]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /agent/sessions:
    post:
      summary: 创建会话
      tags: [Agent]
      responses:
        '200':
          description: 成功

  /agent/sessions/{id}:
    get:
      summary: 获取会话详情
      tags: [Agent]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功

  /agent/sessions/{id}/messages:
    get:
      summary: 获取会话消息
      tags: [Agent]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功

  /search/query:
    post:
      summary: 知识检索
      tags: [Search]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchQueryRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SearchResponse'


  /modeling/compile:
    post:
      summary: Snowy v2 生成式统一建模编译
      description: 大模型推理优先生成 GenerativeModelPackage，并持久化模型包。
      tags: [Modeling]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelingCompileRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'

  /modeling/packages/{id}:
    get:
      summary: 获取生成式模型包
      tags: [Modeling]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功

  /modeling/physics/analyze:
    post:
      summary: 物理 / 3D 场景解析
      tags: [Physics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicsAnalyzeRequest'
      responses:
        '200':
          description: 成功

  /modeling/render/generate:
    post:
      summary: 前端渲染代码生成
      tags: [Render]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderGenerateRequest'
      responses:
        '200':
          description: 成功

  /modeling/biology/analyze:
    post:
      summary: 生物建模解析
      tags: [Biology]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BiologyAnalyzeRequest'
      responses:
        '200':
          description: 成功

  /user/profile:
    get:
      summary: 获取用户资料
      tags: [User]
      responses:
        '200':
          description: 成功

  /history:
    get:
      summary: 历史记录
      tags: [User]
      responses:
        '200':
          description: 成功

  /favorites:
    get:
      summary: 收藏列表
      tags: [User]
      responses:
        '200':
          description: 成功
    post:
      summary: 添加收藏
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteRequest'
      responses:
        '201':
          description: 收藏成功

  /recommendations:
    get:
      summary: 首页推荐数据
      tags: [Home]
      responses:
        '200':
          description: 成功

components:

  schemas:
    APIResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          type: object
        request_id:
          type: string

    ChatRequest:
      type: object
      required: [message]
      properties:
        session_id:
          type: string
        message:
          type: string
        mode:
          type: string
          enum: [search, physics, biology, auto]
        filters:
          type: object
          properties:
            subject:
              type: string
            grade:
              type: string

    SearchQueryRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        session_id:
          type: string
        filters:
          type: object
          properties:
            subject:
              type: string
            grade:
              type: string
            chapter:
              type: string
            source:
              type: string


    ModelingCompileRequest:
      type: object
      required: [message]
      properties:
        session_id:
          type: string
          format: uuid
        message:
          type: string
        domain:
          type: string
          enum: [auto, physics, biology]
        grade_band:
          type: string
          default: high_school
        target_mode:
          type: string
          enum: [interactive_model, review, explain]
        context:
          type: object
          properties:
            citations:
              type: array
              items:
                $ref: '#/components/schemas/EvidenceRef'
            knowledge_tags:
              type: array
              items:
                type: string
            source_page:
              type: string
            user_notes:
              type: string

    EvidenceRef:
      type: object
      properties:
        doc_id:
          type: string
        source_type:
          type: string
        title:
          type: string
        chapter:
          type: string
        snippet:
          type: string
        knowledge_tags:
          type: array
          items:
            type: string
        confidence:
          type: number

    SearchResponse:
      type: object
      properties:
        answer:
          type: string
        knowledge_tags:
          type: array
          items:
            type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/SearchCitation'
        related_questions:
          type: array
          items:
            $ref: '#/components/schemas/RelatedQuestion'
        misconceptions:
          type: array
          items:
            $ref: '#/components/schemas/MisconceptionTip'
        formula_cards:
          type: array
          items:
            $ref: '#/components/schemas/FormulaCard'
        exam_mappings:
          type: array
          items:
            $ref: '#/components/schemas/ExamMapping'
        next_actions:
          type: array
          items:
            $ref: '#/components/schemas/LearningAction'
        confidence:
          type: number

    SearchCitation:
      type: object
      properties:
        doc_id:
          type: string
        source_type:
          type: string
        snippet:
          type: string
        score:
          type: number

    RelatedQuestion:
      type: object
      properties:
        id:
          type: string
        title:
          type: string

    MisconceptionTip:
      type: object
      properties:
        type:
          type: string
        description:
          type: string
        correction:
          type: string

    FormulaCard:
      type: object
      properties:
        name:
          type: string
        expression:
          type: string
        variables:
          type: array
          items:
            type: string
        applies_to:
          type: array
          items:
            type: string
        limits:
          type: array
          items:
            type: string

    ExamMapping:
      type: object
      properties:
        question_type:
          type: string
        focus:
          type: string
        practice_hint:
          type: string
        knowledge:
          type: array
          items:
            type: string

    LearningAction:
      type: object
      properties:
        type:
          type: string
        label:
          type: string
        description:
          type: string
        target:
          type: string
        tags:
          type: array
          items:
            type: string

    GenerativeModelPackage:
      type: object
      properties:
        package_id:
          type: string
          format: uuid
        domain:
          type: string
          enum: [physics, biology]
        question:
          type: string
        learning_model:
          $ref: '#/components/schemas/LearningModelSpec'
        evidence_refs:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceRef'
        reasoning_trace:
          $ref: '#/components/schemas/ReasoningTrace'
        generative_model:
          type: object
        simulation_logic:
          $ref: '#/components/schemas/DynamicSimulationSpec'
        visualization_graph:
          $ref: '#/components/schemas/GenerativeVisualizationSpec'
        interaction_plan:
          type: object
        assessment_tasks:
          type: array
          items:
            $ref: '#/components/schemas/AssessmentTask'
        validation_report:
          type: object
        regeneration_hints:
          type: array
          items:
            type: object
        warnings:
          type: array
          items:
            type: string
        confidence:
          type: number
        status:
          type: string
        fallback_reason:
          type: string
        created_at:
          type: string
          format: date-time

    LearningModelSpec:
      type: object
      properties:
        domain:
          type: string
        grade_band:
          type: string
        topic:
          type: string
        learning_goal:
          type: string
        knowledge_tags:
          type: array
          items:
            type: string
        difficulty:
          type: string

    ReasoningTrace:
      type: object
      properties:
        summary:
          type: string
        evidence_used:
          type: array
          items:
            type: string
        assumptions:
          type: array
          items:
            type: string
        key_steps:
          type: array
          items:
            type: string
        confidence:
          type: number

    DynamicSimulationSpec:
      type: object
      properties:
        simulation_type:
          type: string
        runtime:
          type: string
        variables:
          type: array
          items:
            type: object
        formulas:
          type: array
          items:
            type: object
        vectors:
          type: array
          items:
            type: object
        curves:
          type: array
          items:
            type: object
        outcomes:
          type: array
          items:
            type: object
        render_instructions:
          type: object
        local_recompute_allowed:
          type: boolean
        regenerate_when:
          type: array
          items:
            type: string

    GenerativeVisualizationSpec:
      type: object
      properties:
        visualization_type:
          type: string
        topic:
          type: string
        nodes:
          type: array
          items:
            type: object
        edges:
          type: array
          items:
            type: object
        process_steps:
          type: array
          items:
            type: object
        experiment_variables:
          type: object
        curve_explanation:
          type: string
        limiting_factors:
          type: array
          items:
            type: string
        mechanism_stages:
          type: array
          items:
            type: object
        variable_effects:
          type: array
          items:
            type: object

    AssessmentTask:
      type: object
      properties:
        task_type:
          type: string
        question:
          type: string
        expected_key_points:
          type: array
          items:
            type: string
        feedback_rule:
          type: string
        misconception_type:
          type: string
        next_action:
          type: string

    PhysicsAnalyzeRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
        context:
          type: string
        target_scene:
          type: string
          enum: [physics_2d, physics_3d, auto]

    RenderGenerateRequest:
      type: object
      required: [scene_spec]
      properties:
        scene_spec:
          type: object
        context:
          type: string
        render_mode:
          type: string
          enum: [react_iframe, html_iframe]

    BiologyAnalyzeRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
        context:
          type: string

    FavoriteRequest:
      type: object
      required: [target_type, target_id, title]
      properties:
        target_type:
          type: string
          enum: [search, physics, biology]
        target_id:
          type: string
        title:
          type: string

