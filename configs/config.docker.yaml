# Snowy Docker 容器内运行配置
# 覆盖默认 config.yaml 中的 localhost 为 Docker 容器名
server:
  host: "0.0.0.0"
  port: 8080
  run_mode: "all"
  mode: "release"
  read_timeout: 30s
  write_timeout: 10m
  shutdown_timeout: 10s

database:
  host: "mysql"
  port: 3306
  user: "snowy"
  password: "snowy_secret"
  name: "snowy"
  charset: "utf8mb4"
  parse_time: true
  loc: "Local"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 30m

redis:
  addr: "redis:6379"
  password: ""
  db: 0
  pool_size: 20

llm:
  # v5 使用 models[] 声明顺序作为调用顺序；所有供应商统一走 OpenAI-compatible 协议。
  models:
    - provider: "openai"
      model_provider: "openai"
      model: "gateway-test-model"
      api_key: ""
      base_url: "https://api.openai.com/v1"
      timeout: 10m
      temperature: 0.2
      max_tokens: 131072
      max_retries: 2
      retry_interval: 1s

auth:
  jwt_secret: "change-me-in-production"
  access_token_ttl: 30m
  refresh_token_ttl: 168h
  google_oauth:
    client_id: ""
    client_secret: ""
    redirect_uri: "http://localhost:3001"

ratelimit:
  authenticated_rpm: 300
  anonymous_rpm: 120

token_budget:
  per_request_input: 131072
  per_request_output: 131072
  per_session: 51200
  per_user_daily: 204800

observability:
  otel_endpoint: "localhost:4317"
  prometheus_path: "/metrics"
  log_level: "info"
  log_format: "json"
